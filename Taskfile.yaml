version: '3'
vars:
  ARTIFACT_NAME: steward-delivery
  TESTPARALLELISM: 4
  GOLIC_VERSION: v0.3.0
  GOLANGCI_VERSION: v2.12.2
  COMMON_LIC: "2026 The Steward Authors"
  TEMPLATE_LIC: "spdx-apache2"
tasks:
  default:
    cmds:
      - task: lint
  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w .
      - goimports -w ./
  build:
    desc: Build all packages
    cmds:
      - go build ./...
  test:
    desc: Run tests
    cmds:
      - go test -parallel {{.TESTPARALLELISM}} ./...
  test-race:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=1 ./...
  proto:
    desc: Fetch the pinned callee protos, lint, and regenerate gen/
    cmds:
      - scripts/proto-generate.sh
      - buf lint
  proto-breaking:
    desc: Check proto/ for breaking changes against main
    cmds:
      - buf breaking proto --against '.git#branch=main,subdir=proto'
  docs:
    desc: Regenerate docs/error-codes.md from the error registry
    cmds:
      - UPDATE_DOCS=1 go test ./internal/errcodes -run TestErrorCodesDocIsCurrent
